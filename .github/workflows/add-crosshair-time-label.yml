name: Add crosshair time label

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - scripts/add_crosshair_time_label.py
      - .github/workflows/add-crosshair-time-label.yml

permissions:
  contents: write

concurrency:
  group: add-crosshair-time-label
  cancel-in-progress: false

jobs:
  patch-build-test-commit:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Apply crosshair time-label correction
        shell: pwsh
        run: python .\scripts\add_crosshair_time_label.py

      - name: Verify repository and architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build trading shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }

      - name: Run complete headless suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Commit verified correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render/cursor_label_layout.h ui/render_document_renderer.cpp tests/cursor_label_layout_tests.cpp tests/run_all.bat scripts/verify_modular_architecture.ps1
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Add pane-aware crosshair time labels'
            git push origin HEAD:p2/kiwoom-mock-gateway
          }
