name: Apply comparison upgrade

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - 'scripts/apply_indicator_pack_and_dual_axis.py'
      - 'scripts/apply_comparison_runtime.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-comparison-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Apply upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git pull --ff-only origin p2/kiwoom-mock-gateway
          python .\scripts\apply_indicator_pack_and_dual_axis.py
          if ($LASTEXITCODE -ne 0) { throw 'indicator/axis migration failed' }
          python .\scripts\apply_comparison_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'comparison runtime migration failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .\scripts\apply_indicator_pack_and_dual_axis.py
          git rm .\scripts\apply_comparison_runtime.py
          git rm .\.github\workflows\apply-comparison-upgrade.yml
          git commit -m 'Add standard indicators and multi-series comparison'
          git push origin HEAD:p2/kiwoom-mock-gateway
