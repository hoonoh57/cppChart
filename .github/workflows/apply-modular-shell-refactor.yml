name: Apply modular shell refactor

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - scripts/apply_modular_shell_refactor.py
      - .github/workflows/apply-modular-shell-refactor.yml

permissions:
  contents: write

concurrency:
  group: apply-modular-shell-refactor
  cancel-in-progress: false

jobs:
  migrate-build-test-commit:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Apply deterministic modular refactor
        shell: pwsh
        run: python .\scripts\apply_modular_shell_refactor.py

      - name: Verify modular architecture
        shell: pwsh
        run: .\scripts\verify_modular_architecture.ps1

      - name: Verify real-data-only production runtime
        shell: pwsh
        run: .\scripts\verify_real_data_only.ps1

      - name: Verify core dependency boundary
        shell: pwsh
        run: .\scripts\verify_core_boundary.ps1

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build modular shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }
          if (-not (Test-Path .\shell.exe)) { throw 'shell.exe was not produced' }

      - name: Run all headless tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Commit verified modular refactor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shell_main.cpp tests/run_all.bat .github/workflows/windows-ci.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Extract market data and generic renderer contracts'
            git push origin HEAD:p2/kiwoom-mock-gateway
          }
