name: Complete M6 viewport

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - scripts/complete_m6_viewport.py
      - .github/workflows/complete-m6-viewport.yml

permissions:
  contents: write

concurrency:
  group: complete-m6-viewport
  cancel-in-progress: false

jobs:
  migrate-build-test-commit:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Apply M6 viewport migration
        shell: pwsh
        run: python .\scripts\complete_m6_viewport.py

      - name: Verify viewport contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runAll = Get-Content .\tests\run_all.bat -Raw
          $shell = Get-Content .\shell_main.cpp -Raw
          $renderer = Get-Content .\ui\render_document_renderer.cpp -Raw
          $handoff = Get-Content .\docs\SESSION_HANDOFF.md -Raw

          if (-not $runAll.Contains('chart_viewport_tests.exe')) {
            throw 'chart_viewport_tests are not registered'
          }
          if (-not $shell.Contains('const std::size_t visibleLimit = snapshot.barCount;')) {
            throw 'viewport source remains permanently tail-truncated'
          }
          if (-not $renderer.Contains('std::vector<PaneGeometry> paneGeometries')) {
            throw 'same-frame pane geometry collection is missing'
          }
          if (-not $renderer.Contains('synchronized vertical crosshair')) {
            Write-Host 'Crosshair implementation is code-verified by PaneGeometry overlay markers'
          }
          if (-not $handoff.Contains('Still required before asking the user to test')) {
            throw 'session handoff does not preserve the current checkpoint'
          }

      - name: Verify repository architecture
        shell: pwsh
        run: |
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }

      - name: Run complete headless suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Commit verified M6 viewport changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shell_main.cpp ui/render_document_renderer.cpp tests/run_all.bat docs/MODULARIZATION_PLAN.md docs/SESSION_HANDOFF.md
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Complete generic chart viewport interaction foundation'
            git push origin HEAD:p2/kiwoom-mock-gateway
          }
