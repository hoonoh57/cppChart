name: Connect real-time stock bars

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - scripts/connect_realtime_stock_bars.py
      - .github/workflows/connect-realtime-stock-bars.yml

permissions:
  contents: write

concurrency:
  group: connect-realtime-stock-bars
  cancel-in-progress: false

jobs:
  patch-build-test-commit:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Apply 0B and render-rate integration
        shell: pwsh
        run: python .\scripts\connect_realtime_stock_bars.py

      - name: Verify real-time source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shell = Get-Content .\shell_main.cpp -Raw
          $runner = Get-Content .\platform\kiwoom_runtime_runner.cpp -Raw
          $market = Get-Content .\core\kiwoom_market_data.cpp -Raw
          $required = @(
            'ApplyStockTradeTick',
            'SubscribeStockTrades',
            'DecodeStockTradeRecord',
            'MergeStockTradeIntoMinuteBars',
            '{ "0B" }',
            'RecordPresentedFrame',
            '렌더 %.1fHz'
          )
          $combined = $shell + $runner + $market
          foreach ($marker in $required) {
            if (-not $combined.Contains($marker)) {
              throw "Missing real-time integration marker: $marker"
            }
          }
          if ($shell.Contains('ImGui::GetIO().Framerate')) {
            throw 'ImGui smoothed FPS remains exposed as an actual render rate'
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }

      - name: Run all headless tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Commit verified integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add `
            core/kiwoom_market_data.h `
            core/kiwoom_market_data.cpp `
            platform/kiwoom_runtime_runner.h `
            platform/kiwoom_runtime_runner.cpp `
            shell_main.cpp `
            tests/kiwoom_market_data_tests.cpp `
            tests/kiwoom_runtime_runner_tests.cpp `
            .github/workflows/windows-ci.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Connect 0B trades to live minute bars'
            git push origin HEAD:p2/kiwoom-mock-gateway
          }
