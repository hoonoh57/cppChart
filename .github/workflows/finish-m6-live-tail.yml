name: Finish M6 live tail

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - scripts/finish_m6_live_tail.py
      - .github/workflows/finish-m6-live-tail.yml

permissions:
  contents: write

concurrency:
  group: finish-m6-live-tail
  cancel-in-progress: false

jobs:
  integrate-build-test-commit:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Integrate live-tail chart source
        shell: pwsh
        run: python .\scripts\finish_m6_live_tail.py

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Verify immutable-history contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shell = Get-Content .\shell_main.cpp -Raw
          $market = Get-Content .\app\market_data_module.cpp -Raw
          $workspace = Get-Content .\app\chart_workspace_module.cpp -Raw
          $contract = Get-Content .\render\render_document.h -Raw

          if ($shell.Contains('CopyVisibleBars(visibleLimit)')) {
            throw 'shell still copies the complete loaded history per tick'
          }
          foreach ($marker in @('SeriesSnapshot()', 'ChartMarketSource chartSource')) {
            if (-not $shell.Contains($marker)) {
              throw "shell live-tail source marker is missing: $marker"
            }
          }
          foreach ($marker in @('completedBars_', 'liveBar_', 'liveWindow.reserve(2)', 'completedRevision_')) {
            if (-not $market.Contains($marker)) {
              throw "MarketDataModule split marker is missing: $marker"
            }
          }
          foreach ($marker in @('BuildCompletedVolume', 'completedVolume_', 'source.completedRevision')) {
            if (-not $workspace.Contains($marker)) {
              throw "ChartWorkspace reuse marker is missing: $marker"
            }
          }
          foreach ($marker in @('class SharedTailSeries final', 'SetShared(', 'SharedPrefix()', 'HasLiveTail()')) {
            if (-not $contract.Contains($marker)) {
              throw "render shared-tail contract marker is missing: $marker"
            }
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }

      - name: Run complete headless suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Commit verified live-tail architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shell_main.cpp scripts/verify_modular_architecture.ps1 docs/MODULARIZATION_PLAN.md docs/SESSION_HANDOFF.md
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Share immutable chart history across live ticks'
            git push origin HEAD:p2/kiwoom-mock-gateway
          }
