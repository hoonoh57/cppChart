name: Fix minute chart API IDs

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - scripts/fix_minute_chart_api_ids.py
      - .github/workflows/fix-minute-chart-api-ids.yml

permissions:
  contents: write

concurrency:
  group: fix-minute-chart-api-ids
  cancel-in-progress: false

jobs:
  patch-build-test-commit:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Correct minute chart API IDs
        shell: pwsh
        run: python .\scripts\fix_minute_chart_api_ids.py

      - name: Verify corrected request contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $core = Get-Content .\core\kiwoom_market_data.cpp -Raw
          $tests = Get-Content .\tests\kiwoom_market_data_tests.cpp -Raw

          if (-not $core.Contains('StockMinuteApiId = "ka10080"')) {
            throw 'stock minute API ID is not ka10080'
          }
          if (-not $core.Contains('IndexMinuteApiId = "ka20005"')) {
            throw 'index minute API ID is not ka20005'
          }
          if ($core.Contains('StockMinuteApiId = "ka10079"')) {
            throw 'stock tick API ID remains on the minute request path'
          }
          if ($core.Contains('IndexMinuteApiId = "ka20004"')) {
            throw 'index tick API ID remains on the minute request path'
          }
          if (-not $tests.Contains('wrong API-ID error must identify ka10080')) {
            throw 'wrong-response regression test is missing'
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }

      - name: Run all headless tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Commit verified correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/kiwoom_market_data.cpp tests/kiwoom_market_data_tests.cpp
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Correct Kiwoom minute chart API IDs'
            git push origin HEAD:p2/kiwoom-mock-gateway
          }
