name: Real-data-only acceptance gate

on:
  push:
    branches:
      - p2/kiwoom-mock-gateway
    paths:
      - shell_main.cpp
      - core/runtime_config.h
      - core/runtime_config.cpp
      - core/kiwoom_session.cpp
      - tests/runtime_config_tests.cpp
      - tests/kiwoom_session_tests.cpp
      - scripts/verify_real_data_only.ps1
      - .github/workflows/windows-ci.yml
      - .github/workflows/real-data-only-gate.yml
  pull_request:
    branches:
      - main
    paths:
      - shell_main.cpp
      - core/runtime_config.h
      - core/runtime_config.cpp
      - core/kiwoom_session.cpp
      - tests/runtime_config_tests.cpp
      - tests/kiwoom_session_tests.cpp
      - scripts/verify_real_data_only.ps1
      - .github/workflows/windows-ci.yml
      - .github/workflows/real-data-only-gate.yml

permissions:
  contents: write

concurrency:
  group: real-data-only-acceptance
  cancel-in-progress: true

jobs:
  verify-and-stamp:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: p2/kiwoom-mock-gateway
          fetch-depth: 0

      - name: Verify production has no synthetic runtime
        shell: pwsh
        run: .\scripts\verify_real_data_only.ps1

      - name: Verify core dependency boundary
        shell: pwsh
        run: .\scripts\verify_core_boundary.ps1

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build real-data-only shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }
          if (-not (Test-Path .\shell.exe)) { throw 'shell.exe was not produced' }

      - name: Run all headless tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Stamp verified source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = git rev-parse HEAD
          @"
          # Real-data-only acceptance gate

          - source commit: `$sourceSha`
          - production synthetic market data: absent
          - production synthetic positions and fills: absent
          - explicit KIWOOM_MOCK configuration: required
          - MSVC x64 shell build: passed
          - all headless tests: passed
          "@ | Set-Content .\docs\REAL_DATA_ONLY_GATE.md -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .\docs\REAL_DATA_ONLY_GATE.md
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Record real-data-only acceptance gate'
            git push origin HEAD:p2/kiwoom-mock-gateway
          }
