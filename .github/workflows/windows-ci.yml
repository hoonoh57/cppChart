name: Windows CI

on:
  push:
    branches:
      - main
      - p1/modularize-shell
      - 'p2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC build and headless tests
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff --check failed'
          }

          $trackedSecrets = @(
            git ls-files |
              Where-Object {
                $_ -match '(^|/)\.env($|\.)' -and
                $_ -notmatch '(\.example|\.sample|\.template)$'
              }
          )

          if ($trackedSecrets.Count -gt 0) {
            throw "Tracked secret configuration files:`n$($trackedSecrets -join "`n")"
          }

      - name: Verify core dependency boundary
        shell: pwsh
        run: .\scripts\verify_core_boundary.ps1

      - name: Verify real-data-only production runtime
        shell: pwsh
        run: .\scripts\verify_real_data_only.ps1

      - name: Verify modular architecture
        shell: pwsh
        run: .\scripts\verify_modular_architecture.ps1

      - name: Verify integrated runtime contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content .\shell_main.cpp -Raw
          $runner = Get-Content .\platform\kiwoom_runtime_runner.cpp -Raw
          $marketCore = Get-Content .\core\kiwoom_market_data.cpp -Raw
          $marketModule = Get-Content .\app\market_data_module.cpp -Raw
          $renderer = Get-Content .\ui\render_document_renderer.cpp -Raw
          $renderContract = Get-Content .\render\render_document.h -Raw
          $runnerTests = Get-Content .\tests\kiwoom_runtime_runner_tests.cpp -Raw
          $transport = Get-Content .\platform\winhttp_transport.cpp -Raw

          $required = @(
            'CPPCHART_SHARED_RUNTIME_INTEGRATED',
            'CPPCHART_UI_THREAD_DATA_HANDOFF',
            'CPPCHART_KIWOOM_RUNTIME_CONNECTED',
            'CPPCHART_REAL_DATA_ONLY',
            'CPPCHART_MAJOR_FEATURE_MODULES',
            'CPPCHART_GENERIC_RENDER_DOCUMENT',
            'std::atomic<int> g_wakeFrames',
            'trading::TradingState g_tradingState',
            'trading::KiwoomRuntimeEngine g_runtimeEngine',
            'WinHttpKiwoomTransport',
            'CanSubmitEntryOrders',
            'CanSubmitLiquidationOrders',
            'RequestStockMinuteBars',
            'MarketDataModule g_marketDataModule',
            'FeatureRegistry g_featureRegistry',
            'BuildMarketChartDocument',
            'DrawRenderDocument',
            'RecordPresentedFrame',
            '렌더 %.1fHz'
          )
          foreach ($marker in $required) {
            if (-not $source.Contains($marker)) {
              throw "Missing integrated runtime marker: $marker"
            }
          }

          $marketRequired = @(
            'StockMinuteApiId = "ka10080"',
            'IndexMinuteApiId = "ka20005"',
            'stk_min_pole_chart_qry',
            'inds_min_pole_qry',
            'conflicting duplicate minute-bar timestamp',
            'OHLC invariant violation',
            'stock minute bars require api-id ka10080',
            'DecodeStockTradeRecord',
            'MergeStockTradeIntoMinuteBars',
            'stock trade time FID 20'
          )
          foreach ($marker in $marketRequired) {
            if (-not $marketCore.Contains($marker)) {
              throw "Missing strict market-data marker: $marker"
            }
          }

          $moduleRequired = @(
            'ApplyMinuteBars',
            'ApplyStockTradeTick',
            'CopyVisibleBars',
            'FeatureLevel::Off',
            'MergeStockTradeIntoMinuteBars'
          )
          foreach ($marker in $moduleRequired) {
            if (-not $marketModule.Contains($marker)) {
              throw "Missing market-data module marker: $marker"
            }
          }

          $renderRequired = @(
            'RenderDocument',
            'CandleSeries',
            'HistogramSeries',
            'ReferenceLine',
            'TextAnnotation'
          )
          foreach ($marker in $renderRequired) {
            if (-not $renderContract.Contains($marker)) {
              throw "Missing generic render contract marker: $marker"
            }
          }

          $rendererForbidden = @(
            'Kiwoom',
            'ka10080',
            'StockTradeTick',
            'OrderIntent',
            'TradingState',
            'SMA',
            'JMA',
            'VWAP',
            'Strategy'
          )
          foreach ($marker in $rendererForbidden) {
            if ($renderer.Contains($marker)) {
              throw "Generic renderer contains feature-specific marker: $marker"
            }
          }

          if ($marketCore.Contains('StockMinuteApiId = "ka10079"')) {
            throw 'stock tick API ID remains on minute request path'
          }
          if ($marketCore.Contains('IndexMinuteApiId = "ka20004"')) {
            throw 'index tick API ID remains on minute request path'
          }

          if (-not $runner.Contains('DeliverMinuteBars')) {
            throw 'Minute-bar responses are not delivered to the application callback'
          }
          if (-not $runner.Contains('SubscribeStockTrades') -or
              -not $runner.Contains('{ "0B" }')) {
            throw 'Selected-stock 0B subscription is not integrated'
          }
          if (-not $runnerTests.Contains('message.find("\"refresh\":\"1\"")')) {
            throw '0B registration does not have a keep-existing regression gate'
          }

          if (-not $transport.Contains('CPPCHART_CONTINUATION_HEADERS')) {
            throw 'WinHTTP continuation response headers are not integrated'
          }

          if ($runner.Contains("StartReceiver()`r`n    {`r`n        StopReceiver();") -or
              $runner.Contains("StartReceiver()`n    {`n        StopReceiver();")) {
            throw 'Receiver startup closes the newly connected socket'
          }

          if ($source.Contains('ImGui::GetIO().Framerate')) {
            throw 'ImGui smoothed FPS is still exposed as an actual render rate'
          }

          $forbidden = @(
            'struct Position {',
            'static double g_realizedPnL',
            'static int  g_wakeFrames',
            'struct MarketDataView final',
            'static std::mutex g_marketDataMutex',
            'static void ApplyStockTradeTick(',
            'static void ApplyMinuteBars(',
            'static void DrawRealCandles(',
            'MakeMockData',
            'MockFeedThread',
            'std::mt19937',
            'normal_distribution',
            'ApplyLocalFill',
            'RuntimeMode::LocalMock',
            '[LOCAL MOCK]'
          )
          foreach ($marker in $forbidden) {
            if ($source.Contains($marker)) {
              throw "Synthetic, legacy, or modularized shell state remains: $marker"
            }
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $installation) {
            throw 'Visual Studio C++ toolchain not found'
          }

          $devCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          "devcmd=$devCmd" >> $env:GITHUB_OUTPUT

      - name: Build trading shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          $command = "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"

          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "build.bat failed, exit code=$LASTEXITCODE"
          }

          if (-not (Test-Path '.\shell.exe')) {
            throw 'shell.exe was not produced'
          }

      - name: Build and run headless tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          $command = "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"

          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "headless tests failed, exit code=$LASTEXITCODE"
          }

      - name: Verify clean source tree after build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            throw "Build or tests modified tracked files:`n$($changes -join "`n")"
          }

      - name: Publish verified executable
        uses: actions/upload-artifact@v4
        with:
          name: cppChart-${{ github.sha }}
          path: shell.exe
          if-no-files-found: error
          retention-days: 7
