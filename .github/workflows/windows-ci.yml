name: Windows CI

on:
  push:
    branches:
      - main
      - p1/modularize-shell
      - 'p2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC build and headless tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply staged indicator shell wiring
        if: github.event_name == 'push' && github.ref_name == 'p2/kiwoom-mock-gateway' && hashFiles('scripts/apply_indicator_shell_wiring.py') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\apply_indicator_shell_wiring.py
          if ($LASTEXITCODE -ne 0) { throw 'indicator shell wiring failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .\shell_main.cpp .\build.bat
          git rm .\scripts\apply_indicator_shell_wiring.py
          git commit -m 'Wire indicators into production chart shell'
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Verify repository policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          $trackedSecrets = @(
            git ls-files |
              Where-Object {
                $_ -match '(^|/)\.env($|\.)' -and
                $_ -notmatch '(\.example|\.sample|\.template)$'
              }
          )
          if ($trackedSecrets.Count -gt 0) {
            throw "Tracked secret configuration files:`n$($trackedSecrets -join "`n")"
          }

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Verify integrated runtime and M6 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content .\shell_main.cpp -Raw
          $runner = Get-Content .\platform\kiwoom_runtime_runner.cpp -Raw
          $marketCore = Get-Content .\core\kiwoom_market_data.cpp -Raw
          $marketModule = Get-Content .\app\market_data_module.cpp -Raw
          $chartModule = Get-Content .\app\chart_workspace_module.cpp -Raw
          $renderer = Get-Content .\ui\render_document_renderer.cpp -Raw
          $renderContract = Get-Content .\render\render_document.h -Raw
          $builder = Get-Content .\render\market_chart_builder.cpp -Raw
          $boundaries = Get-Content .\render\time_boundaries.cpp -Raw
          $runAll = Get-Content .\tests\run_all.bat -Raw
          $build = Get-Content .\build.bat -Raw
          $runnerTests = Get-Content .\tests\kiwoom_runtime_runner_tests.cpp -Raw
          $transport = Get-Content .\platform\winhttp_transport.cpp -Raw

          foreach ($marker in @(
            'CPPCHART_SHARED_RUNTIME_INTEGRATED',
            'CPPCHART_REAL_DATA_ONLY',
            'CPPCHART_MAJOR_FEATURE_MODULES',
            'CPPCHART_GENERIC_RENDER_DOCUMENT',
            'MarketDataModule g_marketDataModule',
            'ChartWorkspaceModule g_chartWorkspaceModule',
            'FeatureRegistry g_featureRegistry',
            'MarketDataSeriesSnapshot marketSeries',
            'ChartMarketSource chartSource',
            'DrawRenderDocument',
            'RecordPresentedFrame')) {
            if (-not $source.Contains($marker)) {
              throw "Missing integrated shell marker: $marker"
            }
          }
          foreach ($marker in @('CopyVisibleBars(visibleLimit)', 'const std::vector<trading::Bar> visibleBars')) {
            if ($source.Contains($marker)) {
              throw "Full-history copy remains in the live render path: $marker"
            }
          }

          foreach ($marker in @(
            'StockMinuteApiId = "ka10080"',
            'IndexMinuteApiId = "ka20005"',
            'DecodeStockTradeRecord',
            'MergeStockTradeIntoMinuteBars')) {
            if (-not $marketCore.Contains($marker)) {
              throw "Missing strict market-data marker: $marker"
            }
          }
          foreach ($marker in @(
            'completedBars_',
            'liveBar_',
            'completedRevision_',
            'SeriesSnapshot()',
            'liveWindow.reserve(2)')) {
            if (-not $marketModule.Contains($marker)) {
              throw "Missing market live-tail marker: $marker"
            }
          }
          foreach ($marker in @(
            'BuildCompletedVolume',
            'completedVolume_',
            'renderSource.completedRevision')) {
            if (-not $chartModule.Contains($marker)) {
              throw "Missing workspace sharing marker: $marker"
            }
          }
          foreach ($marker in @(
            'class SharedTailSeries final',
            'structureRevision',
            'SetShared(',
            'SharedPrefix()',
            'HasLiveTail()',
            'ValueGrid cursorGrid')) {
            if (-not $renderContract.Contains($marker)) {
              throw "Missing shared render contract marker: $marker"
            }
          }
          if (-not $builder.Contains('document.structureRevision = source.completedRevision')) {
            throw 'market chart builder does not publish stable structure revision'
          }

          foreach ($marker in @(
            'PrimaryCandleTimestamps',
            'boundaryStructureRevision',
            'FindTimeBoundaries',
            'TimeBoundaryKind::CalendarDate',
            'ImGuiButtonFlags_MouseButtonLeft',
            'ImGuiButtonFlags_MouseButtonRight',
            'draggingLeft || draggingRight',
            'QuantizeValue(',
            'SeriesBodyWidth(')) {
            if (-not $renderer.Contains($marker)) {
              throw "Missing renderer interaction marker: $marker"
            }
          }
          if ($renderer.Contains('static_cast<double>(nearest->close)')) {
            throw 'horizontal crosshair is still forced to candle close'
          }
          foreach ($marker in @(
            'LocalDayNumber',
            'InferExpectedStep',
            'TimeBoundaryKind::SessionGap')) {
            if (-not $boundaries.Contains($marker)) {
              throw "Missing boundary detector marker: $marker"
            }
          }
          if (-not $runAll.Contains('chart_viewport_tests.exe') -or
              -not $runAll.Contains('time_boundaries_tests.exe') -or
              -not $runAll.Contains('value_grid_tests.exe') -or
              -not $runAll.Contains('series_geometry_tests.exe')) {
            throw 'chart viewport, boundary, value-grid, and geometry tests must be in the full suite'
          }
          if (-not $build.Contains('render\time_boundaries.cpp') -or
              -not $build.Contains('render\value_grid.cpp') -or
              -not $build.Contains('render\series_geometry.cpp')) {
            throw 'render interaction utilities are not linked into shell.exe'
          }

          foreach ($marker in @('Kiwoom', 'ka10080', 'StockTradeTick', 'OrderIntent', 'TradingState', 'SMA', 'JMA', 'VWAP', 'Strategy')) {
            if ($renderer.Contains($marker)) {
              throw "Generic renderer contains feature-specific marker: $marker"
            }
          }
          if (-not $runner.Contains('DeliverMinuteBars') -or
              -not $runner.Contains('SubscribeStockTrades') -or
              -not $runner.Contains('UnsubscribeStockTrades')) {
            throw 'Kiwoom minute and 0B runtime integration is incomplete'
          }
          if (-not $runnerTests.Contains('must not return after reconnect')) {
            throw '0B reconnect regression gate is missing'
          }
          if (-not $transport.Contains('CPPCHART_CONTINUATION_HEADERS')) {
            throw 'WinHTTP continuation headers are missing'
          }
          if ($source.Contains('ImGui::GetIO().Framerate')) {
            throw 'ImGui smoothed FPS is exposed as actual render rate'
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vsDevCmd.bat'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build trading shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }
          if (-not (Test-Path .\shell.exe)) { throw 'shell.exe was not produced' }

      - name: Run complete headless suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Verify clean source tree after build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            throw "Build or tests modified tracked files:`n$($changes -join "`n")"
          }

      - name: Publish verified executable
        uses: actions/upload-artifact@v4
        with:
          name: cppChart-${{ github.sha }}
          path: shell.exe
          if-no-files-found: error
          retention-days: 7
