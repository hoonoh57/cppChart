name: Windows CI

on:
  push:
    branches:
      - main
      - p1/modularize-shell
      - 'p2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC build and headless tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          foreach ($temporary in @(
            '.\scripts\apply_indicator_shell_wiring.py',
            '.\scripts\apply_indicator_legend_properties.py',
            '.\scripts\apply_indicator_management.py',
            '.\scripts\sitecustomize.py',
            '.\scripts\trigger_indicator_legend_apply.txt',
            '.\.github\workflows\apply-indicator-legend.yml')) {
            if (Test-Path $temporary) {
              throw "temporary implementation file must not remain: $temporary"
            }
          }
          $trackedSecrets = @(
            git ls-files |
              Where-Object {
                $_ -match '(^|/)\.env($|\.)' -and
                $_ -notmatch '(\.example|\.sample|\.template)$'
              }
          )
          if ($trackedSecrets.Count -gt 0) {
            throw "Tracked secret configuration files:`n$($trackedSecrets -join "`n")"
          }

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Verify integrated runtime and dynamic indicator contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content .\shell_main.cpp -Raw
          $renderer = Get-Content .\ui\render_document_renderer.cpp -Raw
          $manager = Get-Content .\ui\indicator_manager_ui.cpp -Raw
          $configuration = Get-Content .\app\indicator_configuration.cpp -Raw
          $renderContract = Get-Content .\render\render_document.h -Raw
          $build = Get-Content .\build.bat -Raw
          $runAll = Get-Content .\tests\run_all.bat -Raw
          $runner = Get-Content .\platform\kiwoom_runtime_runner.cpp -Raw
          $runnerTests = Get-Content .\tests\kiwoom_runtime_runner_tests.cpp -Raw
          $transport = Get-Content .\platform\winhttp_transport.cpp -Raw

          foreach ($marker in @(
            'CPPCHART_REAL_DATA_ONLY',
            'CPPCHART_MAJOR_FEATURE_MODULES',
            'CPPCHART_GENERIC_RENDER_DOCUMENT',
            'IndicatorInstanceDefinition',
            'g_indicatorDefinitions',
            'BuildIndicatorRenderPlan(',
            'DrawIndicatorManagerWindow(',
            'IndicatorMarketSource indicatorSource',
            'g_indicatorModule.Update(',
            'DrawRenderDocument',
            'RecordPresentedFrame')) {
            if (-not $source.Contains($marker)) {
              throw "Missing integrated shell marker: $marker"
            }
          }
          if ($source.Contains('DrawIndicatorPropertiesWindow')) {
            throw 'Hardcoded indicator property window remains in shell_main.cpp'
          }
          foreach ($marker in @(
            'IndicatorCatalog()',
            'VisibleIndicatorSpecs(',
            'DuplicateIndicatorDefinition(',
            'ApplyIndicatorColorVariant(',
            'MoveIndicatorToPane(')) {
            if (-not $configuration.Contains($marker)) {
              throw "Missing dynamic indicator configuration marker: $marker"
            }
          }
          foreach ($marker in @(
            'DrawIndicatorManagerWindow(',
            '지표 추가',
            '복제',
            '감추기',
            '기준선 추가',
            '과매수 추가',
            '과매도 추가',
            'ColorEdit4(',
            'EditLineStyle(',
            'EditPaneSelection(',
            'const app::IndicatorInstanceDefinition selectedCopy',
            'const bool selectedVisible')) {
            if (-not $manager.Contains($marker)) {
              throw "Missing indicator manager marker: $marker"
            }
          }
          foreach ($marker in @(
            'DrawPaneLegends',
            'DrawPaneSplitter(',
            'ImGuiMouseCursor_ResizeNS',
            'paneHeightWeights',
            'paneDefaultHeightWeights',
            'configuredWeightChanged',
            'DrawStyledLine(',
            'selectedOwnerId',
            'selectionDoubleClicked')) {
            if (-not $renderer.Contains($marker)) {
              throw "Missing generic renderer marker: $marker"
            }
          }
          foreach ($marker in @(
            'enum class LineStyle',
            'struct LegendEntry final',
            'LineStyle style = LineStyle::Solid',
            'std::vector<LegendEntry> legends')) {
            if (-not $renderContract.Contains($marker)) {
              throw "Missing generic styled render contract: $marker"
            }
          }
          foreach ($marker in @(
            'app\indicator_configuration.cpp',
            'render\pane_layout.cpp',
            'ui\indicator_manager_ui.cpp')) {
            if (-not $build.Contains($marker)) {
              throw "Production source is not linked into shell.exe: $marker"
            }
          }
          foreach ($marker in @(
            'indicator_configuration_tests.exe',
            'pane_layout_tests.exe',
            'render_style_tests.exe',
            'indicator_properties_tests.exe')) {
            if (-not $runAll.Contains($marker)) {
              throw "Required test is not in the complete suite: $marker"
            }
          }
          foreach ($marker in @(
            'Kiwoom', 'ka10080', 'StockTradeTick', 'OrderIntent',
            'TradingState', 'SMA', 'JMA', 'VWAP', 'OBV', 'ADX', 'Strategy')) {
            if ($renderer.Contains($marker)) {
              throw "Generic renderer contains feature-specific marker: $marker"
            }
          }
          if (-not $runner.Contains('DeliverMinuteBars') -or
              -not $runner.Contains('SubscribeStockTrades') -or
              -not $runner.Contains('UnsubscribeStockTrades')) {
            throw 'Kiwoom minute and 0B runtime integration is incomplete'
          }
          if (-not $runnerTests.Contains('must not return after reconnect')) {
            throw '0B reconnect regression gate is missing'
          }
          if (-not $transport.Contains('CPPCHART_CONTINUATION_HEADERS')) {
            throw 'WinHTTP continuation headers are missing'
          }
          if ($source.Contains('ImGui::GetIO().Framerate')) {
            throw 'ImGui smoothed FPS is exposed as actual render rate'
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build trading shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }
          if (-not (Test-Path .\shell.exe)) { throw 'shell.exe was not produced' }

      - name: Run complete headless suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Verify clean source tree after build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            throw "Build or tests modified tracked files:`n$($changes -join "`n")"
          }

      - name: Publish verified executable
        uses: actions/upload-artifact@v4
        with:
          name: cppChart-${{ github.sha }}
          path: shell.exe
          if-no-files-found: error
          retention-days: 7
