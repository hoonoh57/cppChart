name: Windows CI

on:
  push:
    branches:
      - main
      - p1/modularize-shell
      - 'p2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC build and headless tests
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff --check failed'
          }

          $trackedSecrets = @(
            git ls-files |
              Where-Object {
                $_ -match '(^|/)\.env($|\.)' -and
                $_ -notmatch '(\.example|\.sample|\.template)$'
              }
          )

          if ($trackedSecrets.Count -gt 0) {
            throw "Tracked secret configuration files:`n$($trackedSecrets -join "`n")"
          }

      - name: Verify core dependency boundary
        shell: pwsh
        run: .\scripts\verify_core_boundary.ps1

      - name: Verify integrated runtime contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content .\shell_main.cpp -Raw
          $runner = Get-Content .\platform\kiwoom_runtime_runner.cpp -Raw
          $transport = Get-Content .\platform\winhttp_transport.cpp -Raw
          $required = @(
            'CPPCHART_SHARED_RUNTIME_INTEGRATED',
            'CPPCHART_UI_THREAD_DATA_HANDOFF',
            'CPPCHART_KIWOOM_RUNTIME_CONNECTED',
            'std::atomic<int> g_wakeFrames',
            'trading::TradingState g_tradingState',
            'trading::KiwoomRuntimeEngine g_kiwoomRuntimeEngine',
            'WinHttpKiwoomTransport',
            'g_marketDataDirty',
            'ApplyLocalFill('
          )
          foreach ($marker in $required) {
            if (-not $source.Contains($marker)) {
              throw "Missing integrated runtime marker: $marker"
            }
          }

          if (-not $transport.Contains('CPPCHART_CONTINUATION_HEADERS')) {
            throw 'WinHTTP continuation response headers are not integrated'
          }

          if ($runner.Contains("StartReceiver()`r`n    {`r`n        StopReceiver();") -or
              $runner.Contains("StartReceiver()`n    {`n        StopReceiver();")) {
            throw 'Receiver startup closes the newly connected socket'
          }

          $forbidden = @(
            'struct Position {',
            'static double g_realizedPnL',
            'static int  g_wakeFrames'
          )
          foreach ($marker in $forbidden) {
            if ($source.Contains($marker)) {
              throw "Legacy shell state remains: $marker"
            }
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $installation) {
            throw 'Visual Studio C++ toolchain not found'
          }

          $devCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          "devcmd=$devCmd" >> $env:GITHUB_OUTPUT

      - name: Build trading shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          $command = "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"

          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "build.bat failed, exit code=$LASTEXITCODE"
          }

          if (-not (Test-Path '.\shell.exe')) {
            throw 'shell.exe was not produced'
          }

      - name: Build and run headless tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          $command = "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"

          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "headless tests failed, exit code=$LASTEXITCODE"
          }

      - name: Verify clean source tree after build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            throw "Build or tests modified tracked files:`n$($changes -join "`n")"
          }

      - name: Publish verified executable
        uses: actions/upload-artifact@v4
        with:
          name: cppChart-${{ github.sha }}
          path: shell.exe
          if-no-files-found: error
          retention-days: 7
