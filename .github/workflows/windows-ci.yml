name: Windows CI

on:
  push:
    branches:
      - main
      - p1/modularize-shell
      - 'p2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC build and headless tests
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared comparison axis geometry
        if: hashFiles('scripts/apply_comparison_axis_alignment.py') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin p2/kiwoom-mock-gateway
          git switch -C p2/kiwoom-mock-gateway origin/p2/kiwoom-mock-gateway
          python .\scripts\apply_comparison_axis_alignment.py
          if ($LASTEXITCODE -ne 0) { throw 'comparison axis alignment migration failed' }
          git checkout HEAD^ -- .\.github\workflows\windows-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .\scripts\apply_comparison_axis_alignment.py
          git commit -m 'Align dual-axis comparison geometry across panes'
          git push origin HEAD:p2/kiwoom-mock-gateway

      - name: Verify repository policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          foreach ($temporary in @(
            '.\scripts\apply_indicator_pack_and_dual_axis.py',
            '.\scripts\apply_comparison_runtime.py',
            '.\scripts\apply_comparison_axis_alignment.py',
            '.\scripts\fix_comparison_migration.py',
            '.\scripts\sitecustomize.py',
            '.\.github\workflows\apply-comparison-upgrade.yml')) {
            if (Test-Path $temporary) { throw "temporary file remains: $temporary" }
          }
          $trackedSecrets = @(git ls-files | Where-Object {
            $_ -match '(^|/)\.env($|\.)' -and
            $_ -notmatch '(\.example|\.sample|\.template)$'
          })
          if ($trackedSecrets.Count -gt 0) {
            throw "Tracked secret files:`n$($trackedSecrets -join "`n")"
          }

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Verify comparison and indicator contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content .\shell_main.cpp -Raw
          $renderer = Get-Content .\ui\render_document_renderer.cpp -Raw
          $contract = Get-Content .\render\render_document.h -Raw
          $marketData = Get-Content .\core\kiwoom_market_data.cpp -Raw
          $comparison = Get-Content .\app\comparison_module.cpp -Raw
          $comparisonAdapter = Get-Content .\app\comparison_render_adapter.cpp -Raw
          $comparisonUi = Get-Content .\ui\comparison_manager_ui.cpp -Raw
          $indicatorConfig = Get-Content .\app\indicator_configuration.cpp -Raw
          $runner = Get-Content .\platform\kiwoom_runtime_runner.cpp -Raw
          $build = Get-Content .\build.bat -Raw
          $runAll = Get-Content .\tests\run_all.bat -Raw

          foreach ($marker in @(
            'ComparisonModule g_comparisonModule',
            'ComparisonRenderAdapter g_comparisonRenderAdapter',
            'DrawComparisonManagerWindow(',
            'RequestComparisonData(',
            'ApplyComparisonDefinitions(',
            'callbacks.indexValue')) {
            if (-not $source.Contains($marker)) { throw "Missing shell marker: $marker" }
          }
          foreach ($marker in @(
            'struct ValueAxis final',
            'ValueAxisSide',
            'std::string axisId',
            'std::vector<ValueAxis> valueAxes')) {
            if (-not $contract.Contains($marker)) { throw "Missing axis contract: $marker" }
          }
          foreach ($marker in @(
            'SecondaryAxisRange(',
            'DrawSecondaryValueAxis(',
            'sharedLeftAxisColumns',
            'leftAxisWidth',
            'series.axisId')) {
            if (-not $renderer.Contains($marker)) { throw "Missing dual-axis renderer marker: $marker" }
          }
          foreach ($marker in @(
            'TryReadAbsoluteIndexValue(',
            'instrument == MinuteBarInstrument::Index',
            'std::llround(scaled)')) {
            if (-not $marketData.Contains($marker)) { throw "Missing index normalization marker: $marker" }
          }
          foreach ($marker in @(
            'ApplyIndexValueTick(',
            'ApplyStockTradeTick(',
            'comparison series limit is 32')) {
            if (-not $comparison.Contains($marker)) { throw "Missing comparison module marker: $marker" }
          }
          foreach ($marker in @(
            'ComparisonPlacement::PriceSecondaryAxis',
            'axis.side = render::ValueAxisSide::Left',
            'line.axisId = axisId')) {
            if (-not $comparisonAdapter.Contains($marker)) { throw "Missing comparison adapter marker: $marker" }
          }
          foreach ($marker in @(
            'KOSPI', 'KOSDAQ', '가격 패널 이중축', '별도 하단 패널')) {
            if (-not $comparisonUi.Contains($marker)) { throw "Missing comparison UI marker: $marker" }
          }
          foreach ($marker in @(
            '"EMA"', '"BOLLINGER"', '"RSI"', '"MACD"', '"DMI"', '"SUPERTREND"')) {
            if (-not $indicatorConfig.Contains($marker)) { throw "Missing indicator type: $marker" }
          }
          foreach ($marker in @(
            'stockTradeCodes_', 'indexValueCodes_',
            'SubscribeIndexValues(', 'DecodeIndexValueRecord(')) {
            if (-not $runner.Contains($marker)) { throw "Missing realtime comparison marker: $marker" }
          }
          foreach ($marker in @(
            'core\standard_indicators.cpp',
            'core\kiwoom_index_realtime.cpp',
            'app\comparison_module.cpp',
            'app\comparison_render_adapter.cpp',
            'ui\comparison_manager_ui.cpp')) {
            if (-not $build.Contains($marker)) { throw "Build source missing: $marker" }
          }
          foreach ($marker in @(
            'standard_indicators_tests.exe',
            'kiwoom_index_realtime_tests.exe',
            'comparison_module_tests.exe',
            'comparison_render_adapter_tests.exe')) {
            if (-not $runAll.Contains($marker)) { throw "Test missing: $marker" }
          }
          foreach ($forbidden in @('KOSPI', 'KOSDAQ', 'ka20005', '0I', 'EMA', 'MACD')) {
            if ($renderer.Contains($forbidden)) { throw "Generic renderer contains feature marker: $forbidden" }
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build trading shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }
          if (-not (Test-Path .\shell.exe)) { throw 'shell.exe was not produced' }

      - name: Run complete headless suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Verify clean source tree after build
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            throw "Build/tests modified tracked files:`n$($changes -join "`n")"
          }

      - name: Publish verified executable
        uses: actions/upload-artifact@v4
        with:
          name: cppChart-${{ github.sha }}
          path: shell.exe
          if-no-files-found: error
          retention-days: 7
