name: Windows CI

on:
  push:
    branches:
      - main
      - p1/modularize-shell
      - 'p2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Apply M8 search and normalized comparison wiring
        if: hashFiles('scripts/apply_m8_search_normalized_v2.py') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin p2/kiwoom-mock-gateway
          git switch -C p2/kiwoom-mock-gateway origin/p2/kiwoom-mock-gateway
          python .\scripts\apply_m8_search_normalized_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'M8 migration failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .\scripts\apply_m8_search_normalized.py
          git rm .\scripts\apply_m8_search_normalized_v2.py
          git commit -m 'Add symbol search and normalized comparison modes'
          git push origin HEAD:p2/kiwoom-mock-gateway

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Locate MSVC
        id: msvc
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build shell
        shell: pwsh
        run: |
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run full suite
        shell: pwsh
        run: |
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }
