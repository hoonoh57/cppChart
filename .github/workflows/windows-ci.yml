name: Windows CI

on:
  push:
    branches:
      - main
      - p1/modularize-shell
      - 'p2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC build and headless tests
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          foreach ($temporary in @(
            '.\scripts\apply_chart_observation_viewport.py',
            '.\scripts\apply_indicator_pack_and_dual_axis.py',
            '.\scripts\apply_comparison_runtime.py',
            '.\scripts\apply_comparison_axis_alignment.py',
            '.\scripts\apply_acceptance_fixes_0j_indicator_ui.py',
            '.\scripts\apply_fixed_chart_and_reference_footer.py',
            '.\scripts\apply_m8_search_normalized.py',
            '.\scripts\apply_m8_search_normalized_v2.py',
            '.\scripts\apply_m8_search_normalized_v3.py',
            '.\scripts\apply_m8_search_normalized_v4.py',
            '.\scripts\apply_m8_search_normalized_v5.py')) {
            if (Test-Path $temporary) {
              throw "temporary implementation file remains: $temporary"
            }
          }
          $trackedSecrets = @(git ls-files | Where-Object {
            $_ -match '(^|/)\.env($|\.)' -and
            $_ -notmatch '(\.example|\.sample|\.template)$'
          })
          if ($trackedSecrets.Count -gt 0) {
            throw "Tracked secret files:`n$($trackedSecrets -join "`n")"
          }

      - name: Verify architecture boundaries
        shell: pwsh
        run: |
          .\scripts\verify_core_boundary.ps1
          .\scripts\verify_real_data_only.ps1
          .\scripts\verify_modular_architecture.ps1

      - name: Verify chart observation contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $renderer = Get-Content .\ui\render_document_renderer.cpp -Raw
          $rendererHeader = Get-Content .\ui\render_document_renderer.h -Raw
          $chartViewport = Get-Content .\render\chart_viewport.cpp -Raw
          $valueViewport = Get-Content .\render\value_viewport.cpp -Raw
          $chartTests = Get-Content .\tests\chart_viewport_tests.cpp -Raw
          $valueTests = Get-Content .\tests\value_viewport_tests.cpp -Raw
          $build = Get-Content .\build.bat -Raw
          $runAll = Get-Content .\tests\run_all.bat -Raw

          foreach ($marker in @(
            'LatestRightPaddingFraction = 0.12',
            'MaximumRightOverscrollFraction = 0.60',
            'AutomaticTopPaddingFraction = 0.10',
            'paneValueViewports',
            'activeValueAxisPaneId',
            'PanValueViewport(',
            'ZoomValueViewport(',
            'ImGuiMouseCursor_ResizeNS',
            'crosshairCoordinate > axis.Maximum()',
            'coordinate > axis.Maximum()')) {
            if (-not $renderer.Contains($marker) -and
                -not $rendererHeader.Contains($marker)) {
              throw "Missing observation viewport marker: $marker"
            }
          }
          foreach ($marker in @(
            'LatestPadding(',
            'MaximumViewportSpan(',
            'maximumRightOverscrollFraction',
            'viewport.autoScroll = false')) {
            if (-not $chartViewport.Contains($marker)) {
              throw "Missing horizontal viewport contract: $marker"
            }
          }
          foreach ($marker in @(
            'ResetValueViewport(',
            'FollowValueRange(',
            'PanValueViewport(',
            'ZoomValueViewport(',
            'viewport.autoScale = false')) {
            if (-not $valueViewport.Contains($marker)) {
              throw "Missing vertical viewport contract: $marker"
            }
          }
          foreach ($marker in @(
            'latest reset must reserve visible space after the newest bar',
            'manual future-space viewport must survive live updates')) {
            if (-not $chartTests.Contains($marker)) {
              throw "Missing horizontal viewport regression: $marker"
            }
          }
          foreach ($marker in @(
            'dragging the value axis upward must magnify candles',
            'manual value range must survive live data updates',
            'reset must restore top observation margin')) {
            if (-not $valueTests.Contains($marker)) {
              throw "Missing value viewport regression: $marker"
            }
          }
          if (-not $build.Contains('render\value_viewport.cpp')) {
            throw 'value viewport is not linked into shell.exe'
          }
          foreach ($marker in @(
            'chart_viewport_tests.exe',
            'value_viewport_tests.exe')) {
            if (-not $runAll.Contains($marker)) {
              throw "viewport test is not in the complete suite: $marker"
            }
          }

      - name: Verify indicator and comparison contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $renderer = Get-Content .\ui\render_document_renderer.cpp -Raw
          $indicatorConfig = Get-Content .\app\indicator_configuration.cpp -Raw
          $comparisonAdapter = Get-Content .\app\comparison_render_adapter.cpp -Raw
          $comparisonTransform = Get-Content .\app\comparison_transform.cpp -Raw
          $comparisonUi = Get-Content .\ui\comparison_manager_ui.cpp -Raw
          $symbolCatalog = Get-Content .\core\kiwoom_symbol_catalog.cpp -Raw
          $indexRealtime = Get-Content .\core\kiwoom_index_realtime.cpp -Raw
          $runner = Get-Content .\platform\kiwoom_runtime_runner.cpp -Raw

          foreach ($marker in @(
            '"EMA"', '"BOLLINGER"', '"RSI"',
            '"MACD"', '"DMI"', '"SUPERTREND"')) {
            if (-not $indicatorConfig.Contains($marker)) {
              throw "Missing indicator catalog type: $marker"
            }
          }
          foreach ($marker in @(
            'ComparisonPlacement::PriceSecondaryAxis',
            'axis.side = render::ValueAxisSide::Left',
            'line.axisId = axisId')) {
            if (-not $comparisonAdapter.Contains($marker)) {
              throw "Missing comparison render contract: $marker"
            }
          }
          foreach ($marker in @(
            'ComparisonValueMode::Indexed100',
            'ComparisonValueMode::ReturnPercent',
            'ComparisonValueMode::RelativeStrength',
            'FindFirstCommonAnchor')) {
            if (-not $comparisonTransform.Contains($marker) -and
                -not $comparisonAdapter.Contains($marker)) {
              throw "Missing normalized comparison contract: $marker"
            }
          }
          foreach ($marker in @(
            '종목 검색',
            '기준값 100',
            '누적 수익률 %',
            '주 종목 대비 상대강도')) {
            if (-not $comparisonUi.Contains($marker)) {
              throw "Missing comparison UI marker: $marker"
            }
          }
          foreach ($marker in @(
            'ka10099',
            'SearchSymbolCatalog(',
            'stk_cd',
            'stk_nm')) {
            if (-not $symbolCatalog.Contains($marker)) {
              throw "Missing symbol catalog contract: $marker"
            }
          }
          if (-not $indexRealtime.Contains('record.type != "0J"')) {
            throw 'Index realtime decoder is not using official 0J type'
          }
          foreach ($marker in @(
            'SubscribeIndexValues(',
            'DecodeIndexValueRecord(',
            '{ "0J" }',
            'RequestSymbolCatalog(')) {
            if (-not $runner.Contains($marker)) {
              throw "Missing runtime lifecycle marker: $marker"
            }
          }
          foreach ($forbidden in @(
            'KOSPI', 'KOSDAQ', 'ka20005', '0J',
            'EMA', 'MACD', 'SUPERTREND')) {
            if ($renderer.Contains($forbidden)) {
              throw "Generic renderer contains a feature-specific marker: $forbidden"
            }
          }

      - name: Locate MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          "devcmd=$(Join-Path $installation 'Common7\Tools\VsDevCmd.bat')" >> $env:GITHUB_OUTPUT

      - name: Build trading shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call build.bat"
          if ($LASTEXITCODE -ne 0) { throw "build failed, exit code=$LASTEXITCODE" }
          if (-not (Test-Path .\shell.exe)) { throw 'shell.exe was not produced' }

      - name: Run complete headless suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devCmd = '${{ steps.msvc.outputs.devcmd }}'
          & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && call tests\run_all.bat"
          if ($LASTEXITCODE -ne 0) { throw "tests failed, exit code=$LASTEXITCODE" }

      - name: Verify clean source tree after build
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            throw "Build/tests modified tracked files:`n$($changes -join "`n")"
          }

      - name: Publish verified executable
        uses: actions/upload-artifact@v4
        with:
          name: cppChart-${{ github.sha }}
          path: shell.exe
          if-no-files-found: error
          retention-days: 7
